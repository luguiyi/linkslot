name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04-arm
    container: rust:1.96-bullseye
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          set -eu
          apt-get update
          apt-get install -y --no-install-recommends python3 file zip unzip cmake make g++ git curl
          rm -rf /var/lib/apt/lists/*

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets

      # TODO(v1.1): 基线有 33 个测试文件的告警，先只报告；清零后改成 `-- -D warnings`。
      - name: Clippy (device + host, report only)
        run: |
          cargo clippy -p slot --no-default-features --features device || true
          cargo clippy --workspace --all-targets || true

      - name: Test
        run: cargo test --workspace --no-fail-fast

      - name: Card scripts
        run: |
          set -eu
          sh card/test-slotlink.sh
          sh card/test-linkslot-net.sh
          sh card/test-led.sh
          sh card/test-coresave.sh
          sh card/test-lid.sh
          sh card/test-launch.sh
          sh card/test-repair.sh
          sh card/test-slot-wifi.sh

  manifest:
    name: manifest + scripts
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Manifest
        run: |
          set -eu
          python3 build/manifest.py check
          python3 build/manifest.py list
      - name: Dependency direction
        run: python3 build/check-deps.py --enforce
      - name: Shell syntax
        run: |
          set -eu
          for f in build/*.sh card/*.sh cores/*/build.sh; do sh -n "$f"; done
          echo "shell syntax ok"
