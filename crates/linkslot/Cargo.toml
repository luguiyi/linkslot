[package]
name = "linkslot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "linkSlot: WebDAV save-state sync CLI for Slot on H700 handhelds"

[lib]
name = "linkslot"
path = "src/lib.rs"

[[bin]]
name = "linkSlot"
path = "src/main.rs"

[features]
# The handheld build enables `tls-rustls` (see taskfile.yml). The default build
# is HTTP-only and dependency-free of C toolchains so that the whole workspace
# can be built/tested/linted on Windows hosts without rustls/ring.
default = []
tls-rustls = [
    "ureq/rustls",
    "dep:rustls",
    "dep:rustls-pemfile",
    "dep:webpki-roots",
]
mods = ["dep:mlua", "dep:roxmltree", "dep:flate2", "dep:crc32fast"]

[dependencies]
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
percent-encoding.workspace = true
ureq.workspace = true
slot-device = { path = "../slot-device" }
slot-mods = { path = "../slot-mods" }
slot-model = { path = "../slot-model" }

# Lua mods are an optional runtime: the default host build stays free of a C
# toolchain. The device build enables `mods` explicitly (taskfile.yml).
mlua = { workspace = true, optional = true, features = ["lua54", "vendored", "serialize"] }
roxmltree = { workspace = true, optional = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"], optional = true }
crc32fast = { version = "1", optional = true }

# The transport in `src/webdav.rs` speaks HTTP/1.1 itself (ureq 3.4 rejects
# WebDAV custom methods such as MKCOL/MOVE), so the ring provider has to be
# enabled explicitly. The workspace pin uses `default-features = false` with
# ring so no aws-lc-sys/C toolchain is needed for the device cross-build.
rustls = { workspace = true, optional = true }
rustls-pemfile = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
