[package]
name = "slot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["host"]
host = ["dep:winit", "dep:cpal", "dep:gilrs", "slot-gfx/host"]
device = ["slot-gfx/device"]

[dependencies]
slot-gfx = { path = "../slot-gfx", default-features = false }
slot-device = { path = "../slot-device" }
slot-i18n = { path = "../slot-i18n" }
slot-input = { path = "../slot-input" }
slot-power = { path = "../slot-power" }
slot-retro = { path = "../slot-retro" }
slot-store = { path = "../slot-store" }
slot-ui = { path = "../slot-ui" }
slot-mods = { path = "../slot-mods" }
slot-model = { path = "../slot-model" }
winit = { workspace = true, optional = true }
cpal = { workspace = true, optional = true }
gilrs = { workspace = true, optional = true }
libloading = { workspace = true }
libc = { workspace = true }
sha2 = { workspace = true }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
percent-encoding = { workspace = true }
ureq = { workspace = true }
roxmltree = { workspace = true }
crc32fast = "1"
lz4_flex = { workspace = true }
png = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
zip = { version = "2.4", default-features = false, features = ["deflate"] }
jpeg-decoder = "0.3"
encoding_rs = "0.8"

[dev-dependencies]
slot-gfx = { path = "../slot-gfx", default-features = false, features = ["test-support"] }
tempfile = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
openh264 = { version = "0.9.9", features = ["source"] }
mp4 = "0.14.0"

