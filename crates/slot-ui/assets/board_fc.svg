<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200">
  <defs>
    <pattern id="fingers" width="3.533" height="9" patternUnits="userSpaceOnUse">
      <rect x=".55" width="2.43" height="9" rx=".4" fill="#d4a93c"/>
    </pattern>
    <pattern id="pins" width="2.2" height="2.2" patternUnits="userSpaceOnUse">
      <rect x=".5" width="1.2" height="2.2" fill="#b3b3b8"/>
    </pattern>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".22"/>
      <stop offset=".25" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- FC cassette: wide, round ends, centre locating notch, side grips -->
  <path fill="#fe01fe" d="M20 0 H220 Q240 0 240 20 V179 L236 186 H4 L0 179 V20 Q0 0 20 0 Z"/>
  <path fill="#fe02fe" d="M21 3 H219 Q237 3 237 20 V180 L234 185 H6 L3 180 V20 Q3 3 21 3 Z"/>
  <path fill="#fe03fe" d="M6 7 H234 V184 H6 Z"/>
  <rect x="6" y="7" width="228" height="177" fill="url(#shade)"/>

  <!-- PCB -->
  <path fill="#2f7f31" d="M10 10 H230 V172 H10 Z"/>
  <path fill="#3a9a3c" d="M11 12 H229 V170 H11 Z"/>
  <path fill="#2f7f31" d="M12 14 H228 V168 H12 Z"/>

  <!-- top centre notch, through shell and PCB -->
  <rect x="98" y="-2" width="44" height="22" rx="7" fill="#070a0e"/>

  <!-- side grip cutouts -->
  <rect x="0" y="80" width="12" height="42" rx="5" fill="#fe03fe" stroke="#4a5057" stroke-width=".4"/>
  <rect x="228" y="80" width="12" height="42" rx="5" fill="#fe03fe" stroke="#4a5057" stroke-width=".4"/>

  <!-- mounting holes -->
  <g fill="#123b18" stroke="#7fc77a" stroke-width=".5">
    <circle cx="19" cy="21" r="2.6"/><circle cx="221" cy="21" r="2.6"/>
    <circle cx="19" cy="148" r="2.6"/><circle cx="221" cy="148" r="2.6"/>
  </g>
  <g fill="#050706">
    <circle cx="19" cy="21" r="1"/><circle cx="221" cy="21" r="1"/>
    <circle cx="19" cy="148" r="1"/><circle cx="221" cy="148" r="1"/>
  </g>

  <!-- three GBA-style core sockets; the first is the live fceumm seat -->
  <g>
    <rect x="23.2" y="34" width="56" height="44" rx="3" fill="#1b4b20" stroke="#6cc463" stroke-width=".8"/>
    <rect x="27.2" y="38" width="48" height="36" rx="2" fill="#143a18" stroke="#2f6f31" stroke-width=".5"/>
    <rect x="28" y="34" width="46" height="2.4" fill="url(#pins)"/>
    <rect x="28" y="75.6" width="46" height="2.4" fill="url(#pins)"/>

    <rect x="92" y="34" width="56" height="44" rx="3" fill="#1b4b20" stroke="#6cc463" stroke-width=".8"/>
    <rect x="96" y="38" width="48" height="36" rx="2" fill="#143a18" stroke="#2f6f31" stroke-width=".5"/>
    <rect x="97" y="34" width="46" height="2.4" fill="url(#pins)"/>
    <rect x="97" y="75.6" width="46" height="2.4" fill="url(#pins)"/>

    <rect x="160.8" y="34" width="56" height="44" rx="3" fill="#1b4b20" stroke="#6cc463" stroke-width=".8"/>
    <rect x="164.8" y="38" width="48" height="36" rx="2" fill="#143a18" stroke="#2f6f31" stroke-width=".5"/>
    <rect x="165.8" y="34" width="46" height="2.4" fill="url(#pins)"/>
    <rect x="165.8" y="75.6" width="46" height="2.4" fill="url(#pins)"/>
  </g>

  <!-- central game-name recess -->
  <rect x="60" y="92" width="120" height="44" rx="3" fill="#1a1a1a" stroke="#6cc463" stroke-width=".5"/>
  <rect x="64" y="96" width="112" height="36" rx="1.5" fill="#202020"/>

  <!-- 60-pin Famicom edge connector -->
  <rect x="14" y="161" width="212" height="9" fill="url(#fingers)"/>
  <rect x="12" y="159" width="216" height="1.4" fill="#c9a13a" opacity=".7"/>
  <rect x="12" y="170.4" width="216" height="1" fill="#9b7a27" opacity=".8"/>

  <!-- traces -->
  <g fill="none" stroke="#6cc463" stroke-width=".35" opacity=".65">
    <path d="M18 159 V146 H28 V78"/>
    <path d="M24 159 V136 H40 V78"/>
    <path d="M30 159 V126 H52 V78"/>
    <path d="M36 159 V116 H64 V78"/>
    <path d="M42 159 V108 H76 V78"/>
    <path d="M48 159 V100 H88 V78"/>
    <path d="M54 159 V94 H100 V78"/>
    <path d="M60 159 V90 H112 V78"/>
    <path d="M66 159 V88 H124 V78"/>
    <path d="M72 159 V86 H136 V78"/>
    <path d="M78 159 V84 H148"/>
    <path d="M84 159 V84 H160"/>
    <path d="M90 159 V84 H176"/>
    <path d="M96 159 V84 H190"/>
    <path d="M102 159 V84 H204"/>
  </g>

  <!-- bottom shell grip -->
  <rect x="48" y="186" width="144" height="5" rx="2" fill="#fe02fe" stroke="#4a5057" stroke-width=".4"/>
</svg>
