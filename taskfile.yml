version: '3'

# 构建入口收敛为 6 个目标（P2-10）。真正的实现在 build/ 下，task 只是薄封装。

vars:
  OUT: artifacts/linkslot

tasks:
  default:
    desc: 列出可用任务
    silent: true
    cmds:
      - task --list

  build:
    desc: 桌面构建（不碰核心、不出卡包）
    cmds:
      - sh build/dist.sh host

  check:
    desc: fmt + clippy + 设备 clippy + 全量测试 + 卡内脚本测试 + 架构护栏
    cmds:
      - cargo fmt --all -- --check
      - cargo clippy --workspace --all-targets
      - cargo clippy -p slot --no-default-features --features device
      - cargo test --workspace --no-fail-fast
      - python3 build/check-deps.py --enforce
      - sh card/test-slotlink.sh && sh card/test-linkslot-net.sh && sh card/test-led.sh
      - sh card/test-coresave.sh && sh card/test-lid.sh && sh card/test-launch.sh
      - sh card/test-repair.sh && sh card/test-slot-wifi.sh

  dist:h700:
    desc: 生成 SD 卡整包（在容器中构建，产物 artifacts/linkslot）
    cmds:
      - sh build/dist.sh h700 --out {{.OUT}}

  dist:host:
    desc: 只出桌面可执行文件
    cmds:
      - sh build/dist.sh host

  verify:
    desc: 校验 artifacts/linkslot（--release 检查许可证与 GLIBC）
    cmds:
      - sh build/verify.sh {{.OUT}} --release

  deploy:device:
    desc: 用 adb 把已组装的包推到设备（SD 默认 /mnt/sdcard）
    vars:
      SD: '{{.SD | default "/mnt/sdcard"}}'
    cmds:
      - adb wait-for-device
      - adb push {{.OUT}}/System/slot '{{.SD}}/System/slot'
      - adb push {{.OUT}}/System/linkSlot '{{.SD}}/System/linkSlot'
      - adb shell 'chmod +x {{.SD}}/System/slot {{.SD}}/System/linkSlot'
      - adb reboot
